name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Sözdizimi + Pester + Analyzer
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: PowerShell 7 kur
        shell: pwsh
        run: |
          Write-Host "PowerShell $($PSVersionTable.PSVersion)"

      - name: Tüm .ps1 dosyalarının sözdizimi denetimi
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem -Path . -Filter '*.ps1' -File | ForEach-Object {
              $errors = $null
              [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors)
              if ($errors) {
                  Write-Host "::error file=$($_.Name)::Sözdizimi hatası"
                  $errors | ForEach-Object { Write-Host "  line $($_.Extent.StartLineNumber): $($_.Message)" }
                  $failed = $true
              } else {
                  Write-Host "OK  $($_.Name)"
              }
          }
          if ($failed) { exit 1 }

      - name: Modül içe aktarma testi
        shell: pwsh
        run: |
          Import-Module ./CS2Optimizer.psm1 -Force -ErrorAction Stop
          $count = (Get-Module CS2Optimizer).ExportedFunctions.Count
          Write-Host "Modül yüklendi, $count fonksiyon export edildi."
          if ($count -lt 30) { Write-Host "::error::Beklenenden az fonksiyon export edildi"; exit 1 }

      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force -AllowClobber
          $settings = @{
              Severity = @('Error', 'Warning')
              ExcludeRules = @('PSAvoidUsingWriteHost', 'PSUseShouldProcessForStateChangingFunctions')
          }
          $results = Invoke-ScriptAnalyzer -Path . -Recurse -Settings $settings
          $results | Format-Table -AutoSize | Out-String -Width 200 | Write-Host
          $errors = @($results | Where-Object { $_.Severity -eq 'Error' })
          if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Host "::error file=$($_.ScriptName)::$($_.RuleName) - $($_.Message)" }
              exit 1
          }
          Write-Host "Analyzer: hata yok, uyari $($results.Count) adet (bloke etmiyor)."

      - name: Pester testleri
        shell: pwsh
        run: |
          Install-Module Pester -Scope CurrentUser -Force -AllowClobber
          $config = New-PesterConfiguration
          $config.Run.Path = './tests'
          $config.Output.Verbosity = 'Detailed'
          $config.Run.Exit = $true
          $config.TestResult.Enabled = $false
          Invoke-Pester -Configuration $config

      - name: Modul kullanim dogrulamasi
        shell: pwsh
        run: ./tests/Verify-ModuleUsage.ps1
  diagnose:
    name: CI teşhisi (başlatma hatası)
    runs-on: ubuntu-latest
    if: ${{ failure() && !cancelled() }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Olası baslatma engellerini kontrol et
        shell: bash
        run: |
          echo "::group::Ortam"
          echo "Runner: ${{ runner.os }}"
          echo "Actions billing notu: hesap faturalama nedeniyle kilitliyse"
          echo "job'lar 'The job was not started because your account is locked"
          echo "due to a billing issue' mesajiyla baslamaz."
          echo ""
          echo "::group::Hata ayiklama"
          echo "Hata mesajini asagidaki adresten alin:"
          echo "  https://github.com/${{ github.repository }}/actions/runs/\${{ github.run_id }}"
          echo ""
          echo "Hesap faturalama durumu:"
          echo "  https://github.com/settings/billing"
          echo ""
          echo "Bu depo icin CI notu: docs/CI-NOTU.md"

  dry-run:
    name: Dry-run (ayarlara dokunmaz)
    runs-on: windows-latest
    needs: validate

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Scriptlerin dry-run modu
        shell: pwsh
        run: |
          # Dry-run modunda scriptler hiçbir ayarı değiştirmez; sadece
          # çıktı üretir ve çıkış kodu 0 döner.
          $scripts = @(
              './CS2-Windows10-Optimize.ps1',
              './CS2-Win10-Network-Tuning.ps1',
              './CS2-Win10-WinUtil-Preferences.ps1',
              './CS2-Win10-Background-Telemetry-Cleanup.ps1',
              './Get-Cs2SystemReport.ps1'
          )
          foreach ($s in $scripts) {
              Write-Host "--- $s ---"
              & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $s 2>&1 |
                  Select-Object -First 25 | Out-String -Width 160 | Write-Host
              if ($LASTEXITCODE -ne 0) {
                  Write-Host "::error file=$s::dry-run exit code $LASTEXITCODE"
                  exit 1
              }
          }
